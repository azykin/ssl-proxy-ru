name: Bank TLS connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - certs/tbank-ca.pem
      - .github/workflows/verify-bank-tls.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify the production certificate and hostname without sending HTTP
        run: |
          NODE_EXTRA_CA_CERTS=certs/tbank-ca.pem timeout 30 node --input-type=module <<'JS'
          import tls from 'node:tls';
          const host = 'invest-public-api.tbank.ru';
          const socket = tls.connect({ host, port: 443, servername: host, minVersion: 'TLSv1.2', rejectUnauthorized: true });
          socket.once('secureConnect', () => {
            const peer = socket.getPeerCertificate();
            console.log(host, socket.getProtocol(), 'issuer:', peer.issuer.CN, 'valid until:', peer.valid_to);
            socket.destroy();
          });
          socket.once('error', error => {
            console.error('Bank TLS check failed:', error.code);
            process.exitCode = 1;
          });
          JS
